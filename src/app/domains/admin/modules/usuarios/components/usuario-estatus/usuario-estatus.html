@if (activo) {
  <span class="inline-flex items-center gap-1.5 rounded-full bg-green-100 px-2.5 py-1 text-xs font-semibold text-green-700 dark:bg-green-900/30 dark:text-green-400">
    <mat-icon class="size-3.5" svgIcon="circle-check" />
    Activo
  </span>
} @else {
  <span class="inline-flex items-center gap-1.5 rounded-full bg-red-100 px-2.5 py-1 text-xs font-semibold text-red-700 dark:bg-red-900/30 dark:text-red-400">
    <mat-icon class="size-3.5" svgIcon="circle-x" />
    Inactivo
  </span>
}
